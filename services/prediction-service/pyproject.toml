[project]
name = "prediction-service"
version = "0.1.0"
description = "ETA prediction service for the distributed logistics platform"
authors = [
    { name = "Laura", email = "laura.puerto.martin@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13.4",
]

[project.scripts]
prediction-service = "prediction_service.main:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
